<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Expense</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        padding: 30px;
      }
      .card {
        max-width: 450px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        box-sizing: border-box;
      }
      input,
      select {
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      button {
        background: #4338ca;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      a {
        color: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Edit Expense</h2>

      <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" value="{{ expense.title }}" required />

        <input
          type="number"
          name="amount"
          value="{{ expense.amount }}"
          min="0.01"
          step="0.01"
          required
        />

        <select name="category" required>
          <option
            value="Food"
            {%
            if
            expense.category=""
            ="Food"
            %}selected{%
            endif
            %}
          >
            Food
          </option>
          <option
            value="Travel"
            {%
            if
            expense.category=""
            ="Travel"
            %}selected{%
            endif
            %}
          >
            Travel
          </option>
          <option
            value="Shopping"
            {%
            if
            expense.category=""
            ="Shopping"
            %}selected{%
            endif
            %}
          >
            Shopping
          </option>
          <option
            value="Education"
            {%
            if
            expense.category=""
            ="Education"
            %}selected{%
            endif
            %}
          >
            Education
          </option>
          <option
            value="Other"
            {%
            if
            expense.category=""
            ="Other"
            %}selected{%
            endif
            %}
          >
            Other
          </option>
        </select>

        <input
          type="date"
          name="date"
          value="{{ expense.date|date:'Y-m-d' }}"
          required
        />

        <button type="submit">Save Changes</button>
      </form>

      <a href="/">Back to Dashboard</a>
    </div>
  </body>
</html>
